<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ओए राजू — Oye Raju</title>
<meta name="description" content="90s–2000s Bollywood bangers off the college-crowd chai tapri. oyeraju.wtf">
<meta name="theme-color" content="#0E1A3D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Rubik:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; overflow:hidden; background:#120e1e; }
  body{
    font-family:'Rubik', sans-serif;
    color:#F7ECDA;
    -webkit-font-smoothing:antialiased;
  }
  :focus-visible{ outline:3px solid #F4C361; outline-offset:3px; }

  .bg{
    position:fixed; inset:0; width:100%; height:100%;
    display:block;
  }
  .bg svg{
    width:100%; height:100%; display:block;
    animation:kenburns 46s ease-in-out infinite alternate;
    transform-origin:55% 60%;
  }
  @keyframes kenburns{ 0%{ transform:scale(1.02); } 100%{ transform:scale(1.09); } }

  .steamPuff{ opacity:0; animation:puff 3.6s ease-in infinite; transform-box:fill-box; transform-origin:bottom center; }
  .steamPuff.p2{ animation-delay:1.2s; } .steamPuff.p3{ animation-delay:2.3s; }
  @keyframes puff{
    0%{ opacity:0; transform:translateY(0) scale(.6); }
    20%{ opacity:.65; }
    100%{ opacity:0; transform:translateY(-40px) scale(1.3) translateX(5px); }
  }
  .bulbGlow{ animation:twinkle 3s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  .bulbGlow:nth-child(2n){ animation-delay:.7s; }
  .bulbGlow:nth-child(3n){ animation-delay:1.4s; }
  @keyframes twinkle{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }

  /* ===== overlay chrome ===== */
  .topbar{
    position:fixed; top:26px; left:0; right:0;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 26px;
    z-index:5;
  }
  .live{
    position:absolute; left:50%; top:0; transform:translateX(-50%);
    display:flex; align-items:center; gap:8px;
    font-family:'Space Mono', monospace; font-size:13px;
    color:#F7ECDA; opacity:.92;
  }
  .live .dot{
    width:8px; height:8px; border-radius:50%; background:#5FD98A;
    box-shadow:0 0 0 0 rgba(95,217,138,.6);
    animation:pulse 1.8s ease-out infinite;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(95,217,138,.55); } 70%{ box-shadow:0 0 0 8px rgba(95,217,138,0); } 100%{ box-shadow:0 0 0 0 rgba(95,217,138,0); }
  }
  .svc-links{ margin-left:auto; display:flex; gap:22px; }
  .svc-links a{
    color:#F7ECDA; text-decoration:none; font-size:13.5px; font-weight:500;
    opacity:.88; display:flex; align-items:center; gap:6px;
    transition:opacity .15s;
  }
  .svc-links a:hover{ opacity:1; }
  .svc-links svg{ width:14px; height:14px; fill:currentColor; }

  .wordmark{
    position:fixed; top:16%; left:50%; transform:translate(-50%,0);
    z-index:4; text-align:center; width:100%; pointer-events:none;
  }
  .wordmark h1{
    font-family:'Baloo 2', sans-serif; font-weight:800;
    font-size:clamp(56px, 13vw, 150px);
    line-height:.98;
    color:#FBF4E6;
    text-shadow:0 6px 40px rgba(0,0,0,.5), 0 2px 10px rgba(0,0,0,.35), 0 0 60px rgba(209,52,43,.35);
    letter-spacing:.01em;
  }

  /* ===== bottom floating player ===== */
  .player{
    position:fixed; left:50%; bottom:30px; transform:translateX(-50%);
    z-index:6;
    display:flex; align-items:center; gap:16px;
    width:min(640px, 92vw);
    background:linear-gradient(180deg, rgba(62,36,21,.72), rgba(30,17,10,.8));
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    border:1px solid rgba(247,236,218,.12);
    border-radius:60px;
    padding:10px 16px 10px 10px;
    box-shadow:0 20px 50px -18px rgba(0,0,0,.65);
  }
  .thumb{
    width:52px; height:52px; border-radius:50%;
    background:radial-gradient(circle at 32% 30%, #E3963E, #9C5326 75%);
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    box-shadow:inset 0 0 0 2px rgba(247,236,218,.15);
  }
  .thumb svg{ width:24px; height:24px; }

  .meta{ flex:1 1 auto; min-width:0; }
  .meta .title{
    font-family:'Baloo 2', sans-serif; font-weight:700; font-size:16px;
    color:#FBF4E6; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .meta .sub{
    font-size:11.5px; color:rgba(247,236,218,.6);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    margin-top:1px;
  }
  .progress{
    height:3px; border-radius:2px; background:rgba(247,236,218,.18);
    margin-top:7px; overflow:hidden;
  }
  .progress i{
    display:block; height:100%; width:0%; border-radius:2px;
    background:#F4C361;
    transition:width .4s linear;
  }
  .time{
    display:block; margin-top:4px;
    font-family:'Space Mono', monospace;
    font-size:10.5px; color:rgba(247,236,218,.5);
  }

  .transport{ display:flex; align-items:center; gap:6px; flex:0 0 auto; }
  .tbtn{
    width:34px; height:34px; border-radius:50%; border:none;
    background:transparent; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    color:#F7ECDA; transition:background .15s, transform .15s;
  }
  .tbtn:hover{ background:rgba(247,236,218,.1); }
  .tbtn svg{ width:16px; height:16px; fill:currentColor; }
  .tbtn.play{
    width:42px; height:42px; background:#F7ECDA; color:#241609;
  }
  .tbtn.play:hover{ background:#fff; transform:scale(1.04); }
  .tbtn.play svg{ width:18px; height:18px; }

  @media (max-width:520px){
    .wordmark{ top:14%; }
    .svc-links{ gap:14px; }
    .svc-links a span{ display:none; }
    .player{ gap:10px; padding:8px 12px 8px 8px; }
    .meta .title{ font-size:14px; }
  }
  @media (prefers-reduced-motion: reduce){
    .bg svg{ animation:none; }
    .bulbGlow, .steamPuff, .live .dot{ animation:none !important; }
  }
</style>
</head>

<div class="player">
  <div class="thumb">
    <svg viewBox="0 0 24 24" fill="#2A1B10"><path d="M4 9h13a3 3 0 010 6h-1.2A6 6 0 015 15H4V9zm2 2v2h6.5A2 2 0 0016 11H6z"/></svg>
  </div>
  <div class="meta">
    <div class="title" id="trackTitle">Loading…</div>
    <div class="sub" id="trackMovie">&nbsp;</div>
    <div class="progress"><i id="progressFill"></i></div>
    <div class="time" id="trackTime">0:00 / 0:00</div>
  </div>
  <div class="transport">
    <button class="tbtn" id="prevBtn" aria-label="Previous song">
      <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM20 6L10 12l10 6z"/></svg>
    </button>
    <button class="tbtn play" id="playBtn" aria-label="Play or pause">
      <svg id="mainPlaySvg" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="tbtn" id="nextBtn" aria-label="Next song">
      <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM4 6l10 6-10 6z"/></svg>

<iframe id="player" title="audio" style="position:fixed;left:-9999px;top:-9999px;width:320px;height:180px;border:0;" allow="autoplay; encrypted-media"></iframe>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
  const playlist = [
    { title: "Chaiyya Chaiyya", movie: "Dil Se (1998) · Sukhwinder Singh", id: "JS68-1RVTNY" },
    { title: "Tanha Tanha", movie: "Rangeela (1995) · Asha Bhosle", id: "DEU1phkgmbE" },
    { title: "Tu Cheez Badi Hai Mast Mast", movie: "Mohra (1994) · Udit Narayan", id: "fT4vP4PnLxg" },
    { title: "Ankhiyon Se Goli Maare", movie: "Dulhe Raja (1998) · Sonu Nigam", id: "i-ueJ148BFU" },
    { title: "Choli Ke Peeche", movie: "Khalnayak (1993) · Alka Yagnik, Ila Arun", id: "Hkj61veJRHA" },
    { title: "Chura Ke Dil Mera", movie: "Main Khiladi Tu Anari (1994)", id: "1eSG6dLiYxY" },
    { title: "Ek Chatur Naar", movie: "Padosan (1968) · Kishore Kumar", id: "Spy2kMTYQ2o" },
    { title: "Kajra Re", movie: "Bunty Aur Babli (2005)", id: "4dsFQFCvVGU" },
    { title: "Tujhe Dekha To", movie: "DDLJ (1995) · Lata & Kumar Sanu", id: "cNV5hLSa9H8" },
    { title: "O Oh Jaane Jaana", movie: "Pyaar Kiya To Darna Kya (1998)", id: "nLQPTYllTcs" }
  ];

  let idx = 0, playing = false;
  let ytPlayer = null, apiReady = false, pendingPlay = false, loadedIdx = 0;
  const titleEl = document.getElementById('trackTitle');
  const movieEl = document.getElementById('trackMovie');
  const mainPlaySvg = document.getElementById('mainPlaySvg');
  const ytmLink = document.getElementById('ytmLink');
  const spotifyLink = document.getElementById('spotifyLink');
  const progressFill = document.getElementById('progressFill');
  const timeEl = document.getElementById('trackTime');
  let progressTimer = null;

  function updateMeta(){
    const t = playlist[idx];
    titleEl.textContent = t.title;
    movieEl.textContent = t.movie;
    ytmLink.href = 'https://music.youtube.com/search?q=' + encodeURIComponent(t.title);
    spotifyLink.href = 'https://open.spotify.com/search/' + encodeURIComponent(t.title);
  }
  function setIcon(){
    mainPlaySvg.innerHTML = playing
      ? '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>'
      : '<path d="M8 5v14l11-7z"/>';
  }

  function formatTime(sec){
    if (!isFinite(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return m + ':' + String(s).padStart(2, '0');
  }
  function startProgressPolling(){
    stopProgressPolling();
    progressTimer = setInterval(() => {
      if (!ytPlayer || typeof ytPlayer.getCurrentTime !== 'function') return;
      const current = ytPlayer.getCurrentTime();
      const duration = ytPlayer.getDuration();
      progressFill.style.width = (duration > 0 ? (current / duration) * 100 : 0) + '%';
      timeEl.textContent = formatTime(current) + ' / ' + formatTime(duration);
    }, 500);
  }
  function stopProgressPolling(){
    if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
  }

  function onYouTubeIframeAPIReady(){
    apiReady = true;
    ytPlayer = new YT.Player('player', {
      videoId: playlist[idx].id,
      playerVars: { autoplay: 0, controls: 0, playsinline: 1, rel: 0, modestbranding: 1 },
      events: {
        onReady: function(){ if (pendingPlay) { pendingPlay = false; play(); } },
        onStateChange: onPlayerStateChange
      }
    });
    loadedIdx = idx;
  }
  window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

  function onPlayerStateChange(e){
    if (e.data === YT.PlayerState.PLAYING) startProgressPolling();
    else stopProgressPolling();
    if (e.data === YT.PlayerState.ENDED) next();
  }

  function play(){
    if (!apiReady || !ytPlayer || typeof ytPlayer.playVideo !== 'function') { pendingPlay = true; return; }
    if (loadedIdx !== idx) {
      ytPlayer.loadVideoById(playlist[idx].id);
      loadedIdx = idx;
      progressFill.style.width = '0%';
      timeEl.textContent = '0:00 / 0:00';
    } else {
      ytPlayer.playVideo();
    }
    playing = true;
    setIcon();
    updateMeta();
  }
  function pause(){
    if (ytPlayer && typeof ytPlayer.pauseVideo === 'function') ytPlayer.pauseVideo();
    playing = false;
    setIcon();
    updateMeta();
  }
  function toggle(){ playing ? pause() : play(); }
  function next(){ idx = (idx + 1) % playlist.length; playing ? play() : updateMeta(); }
  function prev(){ idx = (idx - 1 + playlist.length) % playlist.length; playing ? play() : updateMeta(); }

  document.getElementById('playBtn').addEventListener('click', toggle);
  document.getElementById('nextBtn').addEventListener('click', next);
  document.getElementById('prevBtn').addEventListener('click', prev);

  updateMeta();

  let count = 42;
  const liveEl = document.getElementById('liveCount');
  setInterval(() => {
    count += Math.floor(Math.random() * 5) - 2;
    count = Math.max(18, Math.min(96, count));
    liveEl.textContent = count + ' सिप पर · online';
  }, 4000);
</script>
</body>
</html>
