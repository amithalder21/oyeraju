<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; overflow:hidden; background:#120e1e; }
  body{
    font-family:'Rubik', sans-serif;
    color:#F7ECDA;
    -webkit-font-smoothing:antialiased;
  }
  :focus-visible{ outline:3px solid #F4C361; outline-offset:3px; }

  .bg{
    position:fixed; inset:0; width:100%; height:100%;
    display:block;
  }
  .bg img{
    width:100%; height:100%; display:block;
    object-fit:cover; object-position:55% 60%;
    animation:kenburns 46s ease-in-out infinite alternate;
    transform-origin:55% 60%;
  }
  @keyframes kenburns{ 0%{ transform:scale(1.02); } 100%{ transform:scale(1.09); } }

  .steamPuff{ opacity:0; animation:puff 3.6s ease-in infinite; transform-box:fill-box; transform-origin:bottom center; }
  .steamPuff.p2{ animation-delay:1.2s; } .steamPuff.p3{ animation-delay:2.3s; }
  @keyframes puff{
    0%{ opacity:0; transform:translateY(0) scale(.6); }
    20%{ opacity:.65; }
    100%{ opacity:0; transform:translateY(-40px) scale(1.3) translateX(5px); }
  }
  .bulbGlow{ animation:twinkle 3s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  .bulbGlow:nth-child(2n){ animation-delay:.7s; }
  .bulbGlow:nth-child(3n){ animation-delay:1.4s; }
  @keyframes twinkle{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }

  /* ===== overlay chrome ===== */
  .topbar{
    position:fixed; top:26px; left:0; right:0;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 26px;
    z-index:5;
    transition:opacity .7s ease;
  }
  body.idle .topbar{ opacity:.1; }
  .glass-pill{
    height:32px; box-sizing:border-box;
    display:flex; align-items:center;
    background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
    backdrop-filter:blur(22px) saturate(200%);
    -webkit-backdrop-filter:blur(22px) saturate(200%);
    border:1px solid rgba(255,255,255,.14);
    border-top:1px solid rgba(255,255,255,.3);
    border-radius:20px;
    padding:0 16px;
    box-shadow:0 8px 20px -8px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.14);
  }
  .clock{
    font-family:'Space Mono', monospace; font-size:13px;
    color:#F7ECDA; opacity:.92;
  }
  .clock .blink{ animation:blink 1s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity:0; } }
  .live{
    position:absolute; left:50%; top:0; transform:translateX(-50%);
    display:flex; align-items:center; gap:8px;
    font-family:'Space Mono', monospace; font-size:13px;
    color:#F7ECDA; opacity:.92;
  }
  .live .dot{
    width:8px; height:8px; border-radius:50%; background:#5FD98A;
    box-shadow:0 0 0 0 rgba(95,217,138,.6);
    animation:pulse 1.8s ease-out infinite;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(95,217,138,.55); } 70%{ box-shadow:0 0 0 8px rgba(95,217,138,0); } 100%{ box-shadow:0 0 0 0 rgba(95,217,138,0); }
  }
  .svc-links{ margin-left:auto; display:flex; align-items:center; gap:16px; }
  .svc-links a{
    color:#F7ECDA; text-decoration:none; font-size:13px; font-weight:500;
    opacity:.9; display:flex; align-items:center; gap:6px;
    transition:opacity .15s;
  }
  .svc-links a:hover{ opacity:1; }
  .svc-links svg{ width:16px; height:16px; fill:currentColor; }
  .svc-links a.ytm svg{ fill:#FF5A46; }
  .svc-links a.spotify svg{ fill:#1DB954; }

  .wordmark{
    position:fixed; top:40%; left:50%; transform:translate(-50%,-50%);
    z-index:4; text-align:center; width:100%; pointer-events:none;
  }
  .wordmark::before{
    content:"";
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:min(1030px, 92vw); height:220%;
    background:radial-gradient(ellipse at center, rgba(8,5,4,.5) 0%, rgba(8,5,4,.28) 45%, rgba(8,5,4,0) 75%);
    z-index:-1;
  }
  .wordmark h1{
    font-family:'Baloo 2', sans-serif; font-weight:800;
    font-size:clamp(54px, 12.3vw, 144px);
    line-height:.98;
    color:#FBF4E6;
    text-shadow:0 6px 40px rgba(0,0,0,.5), 0 2px 10px rgba(0,0,0,.35), 0 0 60px rgba(209,52,43,.35);
    letter-spacing:.01em;
  }

  /* ===== bottom floating player ===== */
  .player{
    position:fixed; left:50%; bottom:32px; transform:translateX(-50%);
    z-index:6;
    display:flex; align-items:center; gap:14.4px;
    width:min(680px, 94vw);
    background:linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.04));
    backdrop-filter:blur(32px) saturate(200%);
    -webkit-backdrop-filter:blur(32px) saturate(200%);
    border:1px solid rgba(255,255,255,.22);
    border-top:1px solid rgba(255,255,255,.5);
    border-radius:48px;
    padding:9.6px 16px 9.6px 9.6px;
    box-shadow:0 24px 60px -16px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.3), inset 0 0 50px rgba(255,255,255,.04);
    transition:opacity .7s ease;
  }
  body.idle .player{ opacity:.15; }
  .thumb{
    width:48px; height:48px; border-radius:50%;
    background:radial-gradient(circle at 32% 30%, #E3963E, #9C5326 75%);
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 3px rgba(247,236,218,.14), 0 6px 16px -4px rgba(0,0,0,.5);
  }
  .thumb svg{ width:21px; height:21px; }
  .thumb img{ width:100%; height:100%; border-radius:50%; object-fit:cover; }

  .meta{ flex:1 1 auto; min-width:0; }
  .meta .title{
    font-family:'Baloo 2', sans-serif; font-weight:700; font-size:14px;
    color:#FBF4E6; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .meta .sub{
    font-size:9.6px; color:rgba(247,236,218,.62);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    margin-top:1.6px;
  }
  .progress{
    height:4px; border-radius:2px; background:rgba(247,236,218,.06);
    margin-top:8px; overflow:hidden;
  }
  .progress i{
    display:block; height:100%; width:0%; border-radius:2px;
    background:linear-gradient(90deg, #F4C361, #E3963E);
    box-shadow:0 0 8px rgba(244,195,97,.5);
    transition:width .4s linear;
  }
  .progress.indeterminate{ display:none; }
  .eq{
    display:none;
    align-items:flex-end;
    justify-content:space-between;
    width:100%;
    height:7px;
    margin-top:8px;
  }
  .progress.indeterminate ~ .eq{ display:flex; }
  .eq i{
    display:block;
    flex:1 1 auto;
    margin-right:.6px;
    border-radius:1px;
    background:linear-gradient(180deg, #F4C361, #E3963E);
    box-shadow:0 0 4px rgba(244,195,97,.5);
    animation:eqBeat 1.2s ease-in-out infinite;
    animation-delay:calc(var(--i, 0) * 0.035s);
  }
  .eq i:last-child{ margin-right:0; }
  .eq.paused i{ animation-play-state:paused; }
  @keyframes eqBeat{
    0%, 100%{ height:18%; }
    50%{ height:100%; }
  }
  .time{
    display:block; margin-top:4px;
    font-family:'Space Mono', monospace;
    font-size:9px; letter-spacing:.03em; color:rgba(247,236,218,.55);
  }

  .transport{ display:flex; align-items:center; gap:6.4px; flex:0 0 auto; }
  .tbtn{
    width:29px; height:29px; border-radius:50%; border:none;
    background:transparent; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    color:#F7ECDA; transition:background .15s, transform .15s;
  }
  .tbtn:hover{ background:rgba(247,236,218,.12); transform:scale(1.06); }
  .tbtn svg{ width:14px; height:14px; fill:currentColor; }
  .tbtn.play{
    width:38px; height:38px; background:#F7ECDA; color:#241609;
    box-shadow:0 4px 18px -4px rgba(244,195,97,.55);
  }
  .tbtn.play:hover{ background:#fff; transform:scale(1.06); }
  .tbtn.play svg{ width:16px; height:16px; }

  .toast{
    position:fixed; left:50%; bottom:110px; transform:translateX(-50%) translateY(8px);
    background:rgba(20,12,7,.92); color:#FBF4E6; padding:9px 18px; border-radius:20px;
    font-size:13px; opacity:0; pointer-events:none; z-index:20;
    transition:opacity .25s ease, transform .25s ease;
    border:1px solid rgba(255,255,255,.14);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width:520px){
    .svc-links{ gap:14px; }
    .svc-links a span{ display:none; }
    .player{ gap:10px; padding:8px 12px 8px 8px; }
    .meta .title{ font-size:14px; }
  }
  @media (prefers-reduced-motion: reduce){
    .bg img{ animation:none; }
    .bulbGlow, .steamPuff, .live .dot{ animation:none !important; }
  }
</style>

    thumbEl.src = 'https://i.ytimg.com/vi/' + t.id + '/hqdefault.jpg';

      navigator.mediaSession.metadata = new MediaMetadata({

  function formatTime(sec){
    if (!isFinite(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return m + ':' + String(s).padStart(2, '0');
  }
  function startProgressPolling(){
    stopProgressPolling();
    let failCount = 0;
    progressTimer = setInterval(() => {
      if (!ytPlayer || typeof ytPlayer.getCurrentTime !== 'function') return;
      try {
        const current = ytPlayer.getCurrentTime();
        const duration = ytPlayer.getDuration();
        progressFill.style.width = (duration > 0 ? (current / duration) * 100 : 0) + '%';
        timeEl.textContent = formatTime(current) + ' / ' + formatTime(duration);
        failCount = 0;
      } catch (err) {
        failCount++;
        if (failCount >= 3) stopProgressPolling();
      }
    }, 500);
  }

    ytPlayer = new YT.Player('player', {

          loadedIdx = idx;

        onStateChange: onPlayerStateChange
      }

    if (usingFallback) return;

  });

  document.addEventListener('keydown', function(e){
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowRight') { e.preventDefault(); next(); }
    else if (e.code === 'ArrowLeft') { e.preventDefault(); prev(); }
  });

  if ('mediaSession' in navigator) {
    navigator.mediaSession.setActionHandler('play', function(){ if (!playing) play(); });
    navigator.mediaSession.setActionHandler('pause', function(){ if (playing) pause(); });
    navigator.mediaSession.setActionHandler('previoustrack', prev);
    navigator.mediaSession.setActionHandler('nexttrack', next);
  }

  updateMeta();

  const liveEl = document.getElementById('liveCount');
  const presenceId = (function(){
    let id = sessionStorage.getItem('oyeraju_pid');
    if (!id) {
      id = (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now());
      sessionStorage.setItem('oyeraju_pid', id);
    }
    return id;
  })();
  async function pingPresence(){
    try {
      const res = await fetch('/api/presence?id=' + encodeURIComponent(presenceId), { method: 'POST' });
      const data = await res.json();
      if (typeof data.count === 'number') {
        liveEl.textContent = data.count + ' राही यहाँ मौजूद';
      }
    } catch (err) { /* keep last shown count on network failure */ }
  }
  pingPresence();
  setInterval(pingPresence, 15000);

  const clockEl = document.getElementById('clockEl');
  function updateClock(){
    const d = new Date();
    let h = d.getHours();
    const m = String(d.getMinutes()).padStart(2, '0');
    const ampm = h >= 12 ? 'pm' : 'am';
    h = h % 12; if (h === 0) h = 12;
    clockEl.innerHTML = h + '<span class="blink">:</span>' + m + ' ' + ampm;
  }
  updateClock();
  setInterval(updateClock, 1000);

  let idleTimer = null;
  function resetIdle(){
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function(){ document.body.classList.add('idle'); }, 4000);
  }
  ['mousemove', 'touchstart', 'keydown', 'scroll', 'click'].forEach(function(ev){
    document.addEventListener(ev, resetIdle, { passive: true });
  });
  resetIdle();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('/sw.js').catch(function(){ /* ignore */ });
    });
  }
</script>
</body>
</html>
